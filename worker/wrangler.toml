name = "cyea-submit"
main = "src/index.js"
compatibility_date = "2026-09-21"

# 用 Worker Route 把自有域名的子域指到这个 Worker（避开 *.workers.dev 在国内被墙）
# 注意：这些键必须放在第一个 [[表]] 之前，否则会被当成上一个表的字段（踩过一次）
routes = [
  { pattern = "submit-api.cuiyingdianzi.com/*", zone_name = "cuiyingdianzi.com" }
]

# 阅读数（D1）
[[d1_databases]]
binding = "VIEWS"
database_name = "cyea-views"
database_id = "9e0e566b-590d-4457-bafa-064425734332"

# 投稿记录
[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "4b3555e9bb32416583b4109c6b7a6121"

# 投稿文件：默认存在 KV（下方 R2 未开通）。
# 开通 R2 后把下面三行取消注释即可自动切到 R2，无需改代码。
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "cyea-submissions"


[vars]
GITHUB_REPO = "max133777/Firefly"
GITHUB_BRANCH = "master"
ALLOWED_ORIGIN = "https://cuiyingdianzi.com,http://localhost:4321"

# 密钥用命令行设置，不要写在这里：
#   npx wrangler secret put ADMIN_TOKEN     # 审核口令
#   npx wrangler secret put GITHUB_TOKEN    # fine-grained PAT，仅本站仓库 contents:write
